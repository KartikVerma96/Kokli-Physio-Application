# =============================================================================
#  Kokli — one app container, and a database only when you ask for one
# =============================================================================
#  PRODUCTION, DEPLOYED BY JENKINS  (the normal way — see DEPLOYMENT.md §7)
#    Jenkins copies this file to ~/kokli on the server, beside the server's own
#    docker-compose.override.yml (networks, no published port), writes the image
#    it just built into ~/kokli/.env as KOKLI_IMAGE=kokli:<commit>, and runs
#
#      docker compose up -d --no-build
#
#    Nothing is built on the server. It runs the exact image the tests passed.
#    MySQL is kokli-mysql, its own Compose project (deploy/kokli-db), reached
#    over the kokli-internal network: DB_HOST=kokli-mysql in .env.local. Nginx
#    Proxy Manager reaches the app over kokli-network, by its name, `kokli`.
#
#  PRODUCTION, BY HAND  (no Jenkins, no override — DEPLOYMENT.md §3)
#    docker compose up -d --build
#
#  That starts the application and nothing else, published on 127.0.0.1:3000
#  for a reverse proxy on the same machine, with MySQL running on the host:
#
#    DB_HOST=host.docker.internal
#
#  WHY THE DATABASE IS NOT PART OF THE DEFAULT STACK
#  -------------------------------------------------
#  It holds medical records. `docker compose down -v` deletes volumes, and it is
#  one word away from `docker compose down` — a command people type when they
#  mean "restart". A database kept apart — on the host, or in a project of its
#  own with an external volume — cannot be erased by a typo in this directory,
#  and it is restored from a backup by somebody who knows they are restoring.
#  See DEPLOYMENT.md.
#
#  LOCAL DEVELOPMENT
#    docker compose --profile local-db up -d --build
#
#  That adds a throwaway MySQL for a laptop, where the data is seeded and losing
#  it costs nothing. Never run that profile on a server.
# =============================================================================

name: kokli

services:
  # The service is called kokli, not the usual `app`: on Kokli's server it joins
  # a network the shared reverse proxy is on, and Compose gives every service
  # its name as a DNS name there. A generic name could answer for somebody
  # else's `app` on that proxy.
  kokli:
    build:
      context: .
      args:
        # Compiled into the JavaScript the browser downloads, so it has to be
        # known at build time — unlike everything in .env.local, which is read
        # when the container starts.
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    # Which image to run. On the server, ~/kokli/.env holds the one Jenkins
    # deployed — Compose reads that file by itself — so a hand-typed
    # `docker compose restart` there keeps running the same version rather than
    # trying to build one. Unset (a laptop), it is the image `--build` makes.
    image: ${KOKLI_IMAGE:-kokli:latest}
    container_name: kokli

    # Every secret comes from the host at run time. Nothing is baked into the
    # image, and this file names no credential of its own.
    env_file:
      - .env.local

    # Bound to loopback, not 0.0.0.0: a reverse proxy on the same machine
    # terminates TLS and forwards to this port; nothing outside the machine
    # should reach the Node process directly, and on a server with no firewall
    # that is the difference. (Kokli's server publishes no port at all — its
    # override resets this list.)
    ports:
      - '127.0.0.1:3000:3000'

    # Lets the container reach a MySQL running on the host as
    # `host.docker.internal`, which Docker provides on macOS and Windows but not
    # on Linux without this line.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    # The backups directory is the host's, not the container's. scripts/backup.js
    # writes a dump of every clinic's records; written inside the container it
    # would vanish with the next re-create, and the first time anyone noticed
    # would be the day they needed it.
    #
    # Create it before the first `up`, owned by uid 1000 — the `node` user the
    # container runs as. Docker creates a missing bind-mount path as root, and
    # the first sign is a backup that fails at 3am:
    #
    #     mkdir -p backups && sudo chown 1000:1000 backups
    volumes:
      - ./backups:/app/backups

    restart: unless-stopped

    # A ceiling, on a server without swap that other people share. The app
    # normally uses a few hundred MB; a leak ends in Kokli's own restart, not in
    # the kernel choosing somebody else's database to kill. And if the machine
    # does run out of memory, Kokli's processes are the first it considers.
    # The backup and migration containers a deploy runs inherit the same.
    mem_limit: 1536m
    memswap_limit: 1536m
    oom_score_adj: 500

    # Container logs are a disk-filling device left alone. Three files of 10MB
    # is enough to debug yesterday and not enough to fill a small VPS.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    # The image already defines HEALTHCHECK; this only makes `docker compose ps`
    # wait a little longer before judging a cold start.
    healthcheck:
      start_period: 60s

  # ---------------------------------------------------------------------------
  #  LOCAL ONLY. Started by `--profile local-db`, never by a plain `up`.
  # ---------------------------------------------------------------------------
  db:
    profiles: ['local-db']
    # The same version and settings as production (deploy/kokli-db), so a laptop
    # behaves like the server: same collation, same India-time clock.
    image: mysql:9.7
    container_name: kokli-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:30
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_DATABASE: ${DB_NAME:-physio_clinic}
    # Loopback again: a MySQL reachable from the internet is somebody else's
    # database within the week.
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - kokli-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_PASSWORD:-devpassword}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  # Named, so it survives `docker compose down`. It does NOT survive
  # `docker compose down -v`, which is the whole reason production keeps its
  # database somewhere else.
  kokli-db-data:
